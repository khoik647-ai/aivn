<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>AIVN AGENT đang điều khiển máy</title>
<style>
html,body{margin:0;height:100%;background:transparent;font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;color:#1f2328}
#frame{position:fixed;inset:0;border:4px solid rgba(214,31,44,.85);border-radius:6px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
#bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;border-radius:12px;background:#b3121c;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);max-width:70vw}
#bar img{width:20px;height:20px}#bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bar small{opacity:.9;margin-left:6px}
#bar button{border:0;border-radius:8px;background:#fff;color:#b3121c;font-weight:700;padding:6px 12px;cursor:pointer;font-size:13px}
#status{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(20,20,24,.82);color:#fff;padding:4px 12px;border-radius:999px;font-size:12px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#target{position:fixed;border:3px solid #ff1f2e;border-radius:6px;box-shadow:0 0 0 3px rgba(255,31,46,.25),0 0 18px rgba(255,31,46,.6);pointer-events:none;display:none;transition:all .15s}
#target span{position:absolute;left:-3px;top:-24px;background:#ff1f2e;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px 6px 6px 0;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
#card{position:fixed;right:20px;bottom:20px;width:440px;max-height:calc(100vh - 120px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);border:2px solid #d61f2c;display:none;padding:14px 16px}
#card.risk{border-color:#ff6a00;box-shadow:0 0 0 4px rgba(255,106,0,.25),0 12px 40px rgba(0,0,0,.4)}
#card h3{margin:0 0 6px;font-size:15px;color:#b3121c}#card.risk h3{color:#c2410c}
#card .desc{font-size:14px;font-weight:600;margin:4px 0}
#card .meta{color:#5c6370;font-size:12px}
#card .risk-msg{background:#fff3e6;border:1px solid #ffb27a;color:#9a3412;padding:6px 8px;border-radius:8px;margin:8px 0;font-size:12.5px}
#card pre{background:#f6f1f1;border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:auto;margin:8px 0;font:12.5px/1.4 ui-monospace,Consolas,monospace}
#card .shot{position:relative;margin:8px 0;border-radius:8px;overflow:hidden;border:1px solid #e7dfe0;height:170px;background:#000}
#card .shot canvas{display:block;width:100%;height:100%}
#card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#card button{border:1px solid #cdbfc1;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
#card button.ok{background:#d61f2c;color:#fff;border-color:#d61f2c;font-weight:700}
#card kbd{font:11px ui-monospace,monospace;background:rgba(0,0,0,.08);border-radius:4px;padding:0 4px;margin-left:4px}
#card button.ok kbd{background:rgba(255,255,255,.25)}
#card textarea{width:100%;box-sizing:border-box;margin-top:8px;border:1px solid #cdbfc1;border-radius:8px;padding:6px;font:inherit;min-height:52px;display:none}
#card label{display:flex;gap:6px;align-items:flex-start;margin-top:10px;font-size:12px;color:#5c6370}
</style></head>
<body>
<div id="frame"></div>
<div id="bar"><img src="dragon-white.svg" alt=""><span class="t"><b>AIVN AGENT</b> đang điều khiển máy<small id="hk"></small></span><button id="stop" type="button">■ Dừng ngay</button></div>
<div id="status" hidden></div>
<div id="target"><span></span></div>
<div id="card" role="alertdialog" aria-modal="true" aria-labelledby="cTitle">
  <h3 id="cTitle"></h3>
  <div class="desc" id="cDesc"></div>
  <div class="meta" id="cMeta"></div>
  <div class="risk-msg" id="cRisk" hidden></div>
  <pre id="cText" hidden></pre>
  <div class="shot" id="cShot"><canvas id="cCanvas" width="880" height="340"></canvas></div>
  <textarea id="cReason" placeholder="Lý do / góp ý cho AIVN AGENT (vd. “bấm vào Trần Quỳnh Anh ở dòng thứ hai”)"></textarea>
  <div class="row">
    <button class="ok" id="cOk" type="button">Cho phép<kbd>Ctrl+Enter</kbd></button>
    <button id="cNo" type="button">Từ chối<kbd>Esc</kbd></button>
    <button id="cWhy" type="button">Từ chối kèm lý do</button>
  </div>
  <label id="cModeL"><input type="checkbox" id="cMode"> <span>Từ giờ chỉ hỏi bước quan trọng (gửi, thanh toán, xoá, nộp biểu mẫu vẫn luôn hỏi). Các bước khác AIVN AGENT sẽ tự làm — chỉ bật khi bạn tin tưởng việc đang làm.</span></label>
</div>
<script src="overlay.js"></script>
</body></html>
