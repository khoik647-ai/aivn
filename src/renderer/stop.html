<!DOCTYPE html>

<title>AIVN AGENT – Dừng khẩn cấp</title>
<style>
html,body{margin:0;background:transparent;font:13px/1.3 "Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none}
.bar{display:flex;align-items:center;gap:10px;margin:4px;padding:6px 8px 6px 12px;border-radius:12px;background:#b3121c;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);-webkit-app-region:drag}

<body><div class="bar"><img src="dragon-white.svg" alt=""><span><b>AIVN AGENT</b> đang điều khiển máy <small id="hk"></small></span><button id="stop" type="button">■ Dừng ngay</button></div>
